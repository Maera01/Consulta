<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de componentes | Carregando</title>
  <style>
    :root {
      --maera: #f24105;
      --ink: #111113;
      --muted: #6b7280;
      --border: #e5e7eb;
      --surface: #ffffff;
      --background: #f6f7f9;
      --success: #16a34a;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }

  
    body {
      align-items: center;
      background: var(--background);
      color: var(--ink);
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .08);
      max-width: 440px;
      padding: 34px 30px 30px;
      text-align: center;
      width: 100%;
    }

    .loader {
      border: 5px solid #f1f1f1;
      border-radius: 50%;
      border-top-color: var(--maera);
      height: 64px;
      margin: 0 auto 22px;
      width: 64px;
      animation: spin 1s linear infinite;
    }

    h1 {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 10px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .status {
      align-items: center;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 999px;
      color: var(--maera);
      display: inline-flex;
      font-size: 12px;
      font-weight: 800;
      gap: 8px;
      justify-content: center;
      margin: 22px 0;
      padding: 9px 14px;
      text-transform: uppercase;
    }

    .dot {
      background: currentColor;
      border-radius: 50%;
      height: 8px;
      width: 8px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    small {
      color: var(--muted);
      display: block;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      50% { opacity: .35; transform: scale(.75); }
    }
  </style>
</head>
<body>
  <main>
    <div class="loader" aria-hidden="true"></div>
    <h1>Consulta de componentes</h1>
    <p>O aplicativo esta carregando.</p>

    <div class="status">
      <span class="dot"></span>
      Carregando
    </div>

    <p id="message">Aguarde enquanto o servidor inicia.</p>

    <small>Esta pagina verifica automaticamente quando o app terminar de carregar e redireciona sozinha.</small>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const appUrl = params.get("url") || "https://consulta-agcq.onrender.com/";
    const message = document.querySelector("#message");
    let attempts = 0;

    checkApp();

    async function checkApp() {
      attempts += 1;
      message.textContent = `Verificando servidor... tentativa ${attempts}`;
      try {
        const healthUrl = new URL("/api/health", appUrl);
        const response = await fetch(healthUrl, { cache: "no-store" });
        if (response.ok) {
          message.textContent = "Servidor pronto. Abrindo aplicativo...";
          window.location.href = appUrl;
          return;
        }
      } catch {
        // O Render ainda esta acordando.
      }
      setTimeout(checkApp, 4000);
    }
  </script>
</body>
</html>
